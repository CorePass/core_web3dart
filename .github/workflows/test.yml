name: Testing

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test Dart package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze package
        run: dart analyze --fatal-infos

      - name: Run tests
        run: dart test

      - name: Compile integration client
        run: dart compile exe tool/integration_test.dart -o /tmp/core_web3dart_integration_test

      - name: Validate package publication
        run: dart pub publish --dry-run
