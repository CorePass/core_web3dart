name: Publish to pub.dev

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish Dart package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Verify release tag
        shell: bash
        run: |
          package_version="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          release_tag="${GITHUB_REF_NAME#v}"
          if [[ "$release_tag" != "$package_version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $package_version."
            exit 1
          fi

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze package
        run: dart analyze --fatal-infos

      - name: Run tests
        run: dart test

      - name: Validate package publication
        run: dart pub publish --dry-run

      - name: Publish package
        run: dart pub publish --force
