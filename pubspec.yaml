name: core_web3dart
description: Dart library to connect to Core clients. Send transactions and interact with smart contracts!
version: 2.4.9
publish_to: none

environment:
  sdk: ">=2.12.0 <4.0.0"

dependencies:
  # code generation for contracts, shouldn't be imported outside of lib/src/builder/
  build: ^2.0.0
  build_config: ^1.0.0
  dart_style: ^2.0.0
  code_builder: ^4.0.0
  path: ^1.8.0

  built_collection: ^5.0.0
  pointycastle: ^3.7.3
  convert: ^3.0.0
  meta: ^1.1.0
  http: ">=0.13.1 <2.0.0"
  js: ^0.6.3
  uuid: ^3.0.7
  typed_data: ^1.3.1
  stream_channel: ^2.0.0
  stream_transform: ^2.0.0
  json_rpc_2: ^3.0.2
  collection: ^1.14.11
  flutter_ed448:
    git:
      url: git@git.energy:mojtabaparvar/flutter_ed448_pure_dart.git

dev_dependencies:
  build_runner: ^2.0.3
  build_test: ^2.1.0
  web_socket_channel: ^2.0.0
  test: ^1.9.0
  coverage: ^1.1.0
