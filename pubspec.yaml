name: core_web3dart
description: Dart SDK for Core Blockchain RPC, ED448 accounts, signed transactions, wallets, and smart contracts.
version: 2.5.1
homepage: https://github.com/CorePass/core_web3dart
repository: https://github.com/CorePass/core_web3dart.git
issue_tracker: https://github.com/CorePass/core_web3dart/issues

environment:
  sdk: ^3.7.0

dependencies:
  # code generation for contracts, shouldn't be imported outside of lib/src/builder/
  build: ^4.0.0
  build_config: ^1.2.0
  built_collection: ^5.1.1
  code_builder: ^4.11.1
  collection: ^1.19.1
  convert: ^3.0.0
  dart_style: ^3.1.0
  flutter_ed448: ^0.2.0
  hex: ^0.2.0
  http: ">=0.13.1 <2.0.0"
  json_rpc_2: ^4.1.0
  meta: ^1.16.0
  path: ^1.9.0
  pointycastle: ^4.0.0
  stream_channel: ^2.0.0
  stream_transform: ^2.0.0
  typed_data: ^1.3.1
  uuid: ^4.5.1

dev_dependencies:
  async: ^2.13.0
  build_runner: ^2.16.0
  build_test: ^3.5.19
  coverage: ^1.15.0
  lints: ^6.0.0
  test: ^1.31.0
